name: SentinelOps-Lite Azure Cloud Pipeline

on:
  workflow_dispatch:
    inputs:
      ai_review:
        description: Run optional Gemini summaries (not required for deployment)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION:       ${{ vars.PYTHON_VERSION || '3.11' }}
  DOCKERHUB_USERNAME:   ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || vars.REPOSITORY }}
  AZURE_WEBAPP_NAME:    ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_HEALTH_PATH:      ${{ vars.APP_HEALTH_PATH || '/health' }}

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 1. PRE-DEPLOYMENT CHECKS (agent/test_agent.py)
  # ═══════════════════════════════════════════════════════════════
  precheck:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run deterministic pre-check agent
        env:
          PROJECT_PATH:    .
          AI_MODEL:        ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
          AI_PROVIDER:     ${{ vars.AI_PROVIDER || 'gemini' }}
          RUN_AI_REVIEW:   ${{ inputs.ai_review && '1' || '0' }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          TARGET_CLOUD:    azure
          MONITOR_API_URL: ${{ secrets.MONITOR_API_URL_AZURE }}
          MONITOR_TOKEN:   ${{ secrets.MONITOR_TOKEN_AZURE }}
        run: python agent/test_agent.py

      - name: Upload pre-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-reports
          path: |
            reports/**
            errors_report.txt
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  # 2. BUILD AND PUSH IMMUTABLE IMAGES
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build and push immutable images
    needs: precheck
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.image-names.outputs.image_base }}
      image_tag:  ${{ steps.image-names.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_TOKEN_VALUE: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"    || { echo "Missing repository variable DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_REPOSITORY"  || { echo "Missing repository variable DOCKERHUB_REPOSITORY or REPOSITORY"; exit 1; }
          test -n "$DOCKERHUB_TOKEN_VALUE" || { echo "Missing repository secret DOCKERHUB_TOKEN"; exit 1; }

      - name: Set image names
        id: image-names
        run: |
          echo "image_base=docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha,scope=app
          cache-to:   type=gha,mode=max,scope=app

      - name: Prepare monitoring sidecar Dockerfiles
        run: |
          test -f docker/nginx/nginx-azure.conf                              || { echo "Missing docker/nginx/nginx-azure.conf"; exit 1; }
          test -f monitoring/prometheus/prometheus-azure.yml                 || { echo "Missing monitoring/prometheus/prometheus-azure.yml"; exit 1; }
          test -f monitoring/grafana/provisioning/datasources/datasource.yml || { echo "Missing Grafana datasource provisioning"; exit 1; }
          test -f monitoring/grafana/provisioning/dashboards/dashboard.yml   || { echo "Missing Grafana dashboard provisioning"; exit 1; }
          test -f monitoring/grafana/dashboards/ai-agent-dashboard.json      || { echo "Missing ai-agent-dashboard.json"; exit 1; }
          test -f docker/grafana/entrypoint.sh                               || { echo "Missing docker/grafana/entrypoint.sh"; exit 1; }
          if grep -qE 'url: *\[' monitoring/grafana/provisioning/datasources/datasource.yml; then
            echo "Grafana datasource URL contains Markdown link syntax; use url: http://localhost:9090/prometheus/"; exit 1
          fi

          chmod +x docker/grafana/entrypoint.sh

          mkdir -p docker/nginx docker/prometheus docker/grafana

          cat > docker/nginx/Dockerfile <<'DEOF'
          FROM nginx:1.27-alpine
          COPY docker/nginx/nginx-azure.conf /etc/nginx/conf.d/default.conf
          DEOF

          cat > docker/prometheus/Dockerfile <<'DEOF'
          FROM prom/prometheus:v2.53.0
          COPY monitoring/prometheus/prometheus-azure.yml /etc/prometheus/prometheus.yml
          COPY monitoring/prometheus/alert.rules.yml /etc/prometheus/alert.rules.yml
          COPY monitoring/prometheus/recording.rules.yml /etc/prometheus/recording.rules.yml
          CMD ["--config.file=/etc/prometheus/prometheus.yml", "--web.external-url=/prometheus/", "--web.route-prefix=/prometheus/"]
          DEOF

          cat > docker/grafana/Dockerfile <<'DEOF'
          FROM grafana/grafana:11.1.0
          USER root
          COPY --chown=472:0 docker/grafana/entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh
          COPY --chown=472:0 monitoring/grafana/provisioning/ /etc/grafana/provisioning/
          COPY --chown=472:0 monitoring/grafana/dashboards/ /var/lib/grafana/dashboards/
          USER 472
          ENTRYPOINT ["/entrypoint.sh"]
          DEOF

      - name: Build and push nginx monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:nginx-${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to:   type=gha,mode=max,scope=nginx

      - name: Build and push Prometheus monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prometheus/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:prometheus-${{ github.sha }}
          cache-from: type=gha,scope=prometheus
          cache-to:   type=gha,mode=max,scope=prometheus

      - name: Build and push Grafana monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/grafana/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          no-cache: true
          tags: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:grafana-${{ github.sha }}
          #cache-from: type=gha,scope=grafana
          #cache-to:   type=gha,mode=max,scope=grafana

      - name: Scan application image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        continue-on-error: true
        with:
          image-ref: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # ═══════════════════════════════════════════════════════════════
  # 3. DEPLOY TO AZURE APP SERVICE (agent/errors.py on failure)
  # ═══════════════════════════════════════════════════════════════
  deploy_azure:
    name: Deploy to Azure App Service
    needs: build
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.azure-host.outputs.app_url }}
    env:
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      MONITOR_TOKEN_AZURE:    ${{ secrets.MONITOR_TOKEN_AZURE }}
      # ── PATCH 1: AI + collector env vars at job level ──
      GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER:            ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_MODEL:               ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
      GH_METRICS_TOKEN:       ${{ secrets.GH_METRICS_TOKEN }}
      GH_METRICS_REPO:        ${{ vars.GH_METRICS_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for deployment agents
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install agent dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Azure configuration
        env:
          AZURE_CREDENTIALS_VALUE: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          test -n "$AZURE_WEBAPP_NAME"      || { echo "Add repository variable AZURE_WEBAPP_NAME"; exit 1; }
          test -n "$AZURE_RESOURCE_GROUP"   || { echo "Add repository variable AZURE_RESOURCE_GROUP"; exit 1; }
          test -n "$GRAFANA_ADMIN_PASSWORD" || { echo "Add repository secret GRAFANA_ADMIN_PASSWORD"; exit 1; }
          test -n "$AZURE_CREDENTIALS_VALUE"|| { echo "Add repository secret AZURE_CREDENTIALS"; exit 1; }
          test -n "$MONITOR_TOKEN_AZURE"    || { echo "Add repository secret MONITOR_TOKEN_AZURE"; exit 1; }
          test -n "$DOCKERHUB_USERNAME"     || { echo "Missing variable DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_REPOSITORY"   || { echo "Missing variable DOCKERHUB_REPOSITORY or REPOSITORY"; exit 1; }

      - name: Validate Azure files exist
        run: |
          test -f docker/docker-compose.azure.yml || { echo "Missing docker/docker-compose.azure.yml"; exit 1; }
          test -f docker/nginx/nginx-azure.conf   || { echo "Missing docker/nginx/nginx-azure.conf"; exit 1; }
          test -f deployment/deploy-azure.sh      || { echo "Missing deployment/deploy-azure.sh"; exit 1; }
          test -f agent/errors.py                 || { echo "Missing agent/errors.py"; exit 1; }

      - name: Verify deploy script is valid bash
        run: |
          head -1 deployment/deploy-azure.sh | grep -q "^#!/" || { echo "ERROR: deploy-azure.sh does not start with shebang line"; exit 1; }
          bash -n deployment/deploy-azure.sh || { echo "ERROR: deploy-azure.sh has syntax errors"; exit 1; }
          echo "✅ deploy-azure.sh is valid bash script"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Make deploy script executable
        run: chmod +x deployment/deploy-azure.sh

      - name: Deploy to Azure via deploy-azure.sh
        id: azure_deploy
        continue-on-error: true
        env:
          AZURE_WEBAPP_NAME:      ${{ env.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP:   ${{ env.AZURE_RESOURCE_GROUP }}
          DOCKERHUB_USERNAME:     ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY:   ${{ env.DOCKERHUB_REPOSITORY }}
          REPOSITORY:             ${{ env.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN:        ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_SHA:             ${{ github.sha }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          MONITOR_TOKEN_AZURE:    ${{ secrets.MONITOR_TOKEN_AZURE }}
          MONITOR_TOKEN:          ${{ secrets.MONITOR_TOKEN_AZURE }}
          APP_HEALTH_PATH:        ${{ env.APP_HEALTH_PATH }}
          # ── PATCH 2: AI + collector env vars for deploy script ──
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER:            ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL:               ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
          GH_METRICS_TOKEN:       ${{ secrets.GH_METRICS_TOKEN }}
          GH_METRICS_REPO:        ${{ vars.GH_METRICS_REPO }}
        run: bash deployment/deploy-azure.sh

      - name: Resolve Azure host for outputs
        id: azure-host
        if: always()
        run: |
          HOSTNAME=$(az webapp show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query defaultHostName -o tsv 2>/dev/null || echo "")
          if [ -n "$HOSTNAME" ]; then
            echo "hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"
            echo "app_url=https://${HOSTNAME}" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: Could not resolve Azure hostname for outputs"
            echo "hostname=" >> "$GITHUB_OUTPUT"
            echo "app_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Azure logs before diagnosis
        if: ${{ steps.azure_deploy.outcome == 'failure' }}
        continue-on-error: true
        run: |
          mkdir -p reports
          az webapp log download \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --log-file reports/azure-webapp-logs.zip 2>/dev/null || true
          az webapp show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            -o json > reports/azure-webapp-info.json 2>/dev/null || true

      - name: Diagnose Azure deployment failure (agent/errors.py)
        if: ${{ steps.azure_deploy.outcome == 'failure' }}
        continue-on-error: true
        env:
          TARGET_CLOUD:         azure
          APP_URL:              ${{ steps.azure-host.outputs.app_url }}
          MONITOR_API_URL:      ${{ steps.azure-host.outputs.app_url }}/monitor/status
          MONITOR_TOKEN:        ${{ secrets.MONITOR_TOKEN_AZURE }}
          AZURE_WEBAPP_NAME:    ${{ env.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL:             ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
          AI_PROVIDER:          ${{ vars.AI_PROVIDER || 'gemini' }}
        run: python agent/errors.py

      - name: Collect Azure deployment diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports
          az webapp log download \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --log-file reports/azure-webapp-logs.zip 2>/dev/null || true
          az webapp show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            -o json > reports/azure-webapp-info.json 2>/dev/null || true
          az webapp config appsettings list \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output table > reports/azure-app-settings.txt 2>/dev/null || true
          az webapp config container show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            -o json > reports/azure-container-config.json 2>/dev/null || true
          echo "===== Azure App Service Info ====="
          cat reports/azure-webapp-info.json 2>/dev/null || true
          echo ""
          echo "===== Azure App Settings ====="
          cat reports/azure-app-settings.txt 2>/dev/null || true
          echo ""
          echo "===== Azure Container Config ====="
          cat reports/azure-container-config.json 2>/dev/null || true

      - name: Upload Azure deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-diagnostics
          path: |
            reports/**
            errors_report.txt
          if-no-files-found: ignore

      - name: Fail Azure job after diagnostics
        if: ${{ steps.azure_deploy.outcome != 'success' }}
        run: |
          echo "Azure deployment failed. Review the deploy-azure.sh log and azure-deployment-diagnostics artifact."
          exit 1

  # ═══════════════════════════════════════════════════════════════
  # 4. VERIFY AZURE DEPLOYMENT (agent/final_agent.py)
  # ═══════════════════════════════════════════════════════════════
  verify_azure:
    name: Verify Azure deployment
    if: ${{ always() && needs.deploy_azure.result == 'success' }}
    needs: deploy_azure
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ needs.deploy_azure.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install post-deploy agent dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for Azure containers to stabilize
        run: |
          echo "Waiting 60 seconds for all Azure containers to fully start..."
          sleep 60

      - name: Verify public routes
        run: |
          set -e
          echo "====================================================="
          echo " Route Verification: ${APP_URL}"
          echo "====================================================="
          PASS=0
          FAIL=0
          for path in /health / /metrics /prometheus/-/ready /grafana/api/health /node-exporter/metrics; do
            code=$(curl -ksS -o /tmp/route.out -w '%{http_code}' --max-time 30 "${APP_URL}${path}" || true)
            echo "$path -> HTTP $code"
            case "$path" in
              /health|/|/metrics)
                if [ "$code" = "200" ]; then
                  PASS=$((PASS+1))
                else
                  echo "  ⚠️ WARNING: $path returned $code (expected 200)"
                  FAIL=$((FAIL+1))
                fi
                ;;
              *)
                if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                  PASS=$((PASS+1))
                else
                  echo "  ⚠️ WARNING: $path returned $code (expected 200 or 302)"
                  FAIL=$((FAIL+1))
                fi
                ;;
            esac
          done
          echo ""
          echo "Routes passed: $PASS | Routes failed: $FAIL"
          if [ "$FAIL" -gt 3 ]; then
            echo "❌ Too many route failures. Failing verification."
            exit 1
          fi
          echo "✅ Route verification passed."

      - name: Run post-deploy agent (agent/final_agent.py)
        env:
          DEPLOY_URL:       ${{ env.APP_URL }}
          APP_URL:          ${{ env.APP_URL }}
          APP_HEALTH_PATH:  /health
          TARGET_CLOUD:     azure
          MONITOR_API_URL:  ${{ env.APP_URL }}/monitor/status
          MONITOR_TOKEN:    ${{ secrets.MONITOR_TOKEN_AZURE }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL:         ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
          AI_PROVIDER:      ${{ vars.AI_PROVIDER || 'gemini' }}
          RUN_AI_REVIEW:    ${{ inputs.ai_review && '1' || '0' }}
        run: python agent/final_agent.py

      - name: Verify real AI-agent metrics
        continue-on-error: true
        run: |
          for attempt in $(seq 1 6); do
            if curl -ksS --max-time 15 "${APP_URL}/metrics" | grep -q '^agent_last_run_timestamp_seconds'; then
              echo "✅ Real AI-agent metrics are exposed."
              exit 0
            fi
            echo "Agent metrics not visible yet; retry $attempt/6"
            sleep 10
          done
          echo "⚠️ No real agent report metrics were exposed at /metrics."
          echo "Check MONITOR_API_URL and MONITOR_TOKEN."
          exit 1

      - name: Upload Azure post-deploy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-post-deploy-reports
          path: |
            reports/**
            final_report.txt
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  # 5. GENERATE PROJECT DOCUMENTATION
  # ═══════════════════════════════════════════════════════════════
  generate_docs:
    name: Generate Project Documentation
    if: ${{ always() && needs.verify_azure.result == 'success' }}
    needs: verify_azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Debug - List files
        run: ls -la  # Verify requirement-doc.txt exists

      - name: Debug - Show file contents
        run: cat requirement-doc.txt  # Verify file contents

      - name: Install doc generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./requirement-doc.txt --verbose  # Add --verbose for debugging
          python -m pip install python-docx pyyaml gitpython openai tiktoken colorama

      - name: Debug - Show installed packages
        run: pip list  # Verify packages were installed

      - name: Generate documentation
        run: python generate_docx.py

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-documentation-azure
          path: "*.docx"
          retention-days: 90
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  # 6. PIPELINE SUMMARY
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: Pipeline summary
    if: always()
    needs: [precheck, build, deploy_azure, verify_azure, generate_docs]
    runs-on: ubuntu-latest
    steps:
      - name: Print job results
        run: |
          echo "====================================================="
          echo " SentinelOps-Lite Azure Pipeline Summary"
          echo "====================================================="
          echo "precheck     : ${{ needs.precheck.result }}"
          echo "build        : ${{ needs.build.result }}"
          echo "azure deploy : ${{ needs.deploy_azure.result }}"
          echo "azure verify : ${{ needs.verify_azure.result }}"
          echo "====================================================="

          if [ "${{ needs.precheck.result }}" != "success" ]; then
            echo "❌ Pre-deployment checks failed."
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed."
            exit 1
          fi

          if [ "${{ needs.deploy_azure.result }}" != "success" ]; then
            echo "❌ Azure deployment failed."
            exit 1
          fi

          if [ "${{ needs.verify_azure.result }}" != "success" ]; then
            echo "⚠️ Azure verification had issues. Check verify_azure logs."
            exit 1
          fi

          if [ "${{ needs.verify_azure.result }}" != "success" ]; then
            echo "⚠️ Azure verification had issues. Check verify_azure logs."
            exit 1
          fi

          if [ "${{ needs.generate_docs.result }}" != "success" ]; then
            echo "⚠️ Documentation generation failed. Non-blocking."
          fi

          echo "✅ All Azure pipeline jobs passed successfully."
