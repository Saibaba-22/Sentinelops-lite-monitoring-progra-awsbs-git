##################### Grafana — cloud-agnostic config #####################
# Static keys are hardcoded (never change per environment).
# Dynamic values (domain, URLs, password) come from env vars via $__env{VAR}.

[server]
protocol             = http
http_port            = 3000
domain               = $__env{GF_SERVER_DOMAIN}
root_url             = $__env{GF_SERVER_ROOT_URL}
serve_from_sub_path  = true
enable_gzip          = true

[security]
admin_user           = admin
admin_password       = $__env{GF_SECURITY_ADMIN_PASSWORD}
allow_embedding      = true
cookie_secure        = false
cookie_samesite      = disabled

[users]
allow_sign_up        = false
auto_assign_org      = true
auto_assign_org_role = Viewer

[auth]
disable_login_form   = false

[auth.anonymous]
enabled              = false

[live]
allowed_origins      = *

[log]
mode                 = console
level                = info

[dataproxy]
timeout              = 300