# Shared reverse proxy configuration for AWS Elastic Beanstalk
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream app_backend      { server app:5000; }
upstream prom_backend     { server prometheus:9090; }
upstream grafana_backend  { server grafana:3000; }
upstream node_backend     { server node-exporter:9100; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # ─── Health Check ─────────────────────────────────────────────
    location = /health {
        proxy_pass http://app_backend/health;
        access_log off;
    }

    # ─── App ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # ─── Metrics ──────────────────────────────────────────────────
    location = /metrics {
        proxy_pass         http://app_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # ─── Prometheus ───────────────────────────────────────────────
    location = /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        proxy_pass         http://prom_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # ─── Grafana Live (WebSocket) ──────────────────────────────────
    location /grafana/api/live/ {
        proxy_pass         http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # ─── Grafana ──────────────────────────────────────────────────
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass         http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # ─── Node Exporter ────────────────────────────────────────────
    location = /node-exporter {
        return 301 /node-exporter/metrics;
    }

    location /node-exporter/ {
        proxy_pass         http://node_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}