upstream app_backend    { server app:5000; }
upstream prom_backend   { server prometheus:9090; }
upstream grafana_backend { server grafana:3000; }
upstream node_backend   { server node-exporter:9100; }

server {
    listen 80;
    server_name _;

    # ── Flask App ──
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus (sub-path) ──
    location /prometheus/ {
        proxy_pass http://prom_backend/prometheus/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Grafana (sub-path) ──
    location /grafana/ {
        proxy_pass http://grafana_backend/grafana/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Node Exporter (restricted) ──
    location /node-exporter/ {
        proxy_pass http://node_backend/metrics;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://app_backend/health;
    }
}
