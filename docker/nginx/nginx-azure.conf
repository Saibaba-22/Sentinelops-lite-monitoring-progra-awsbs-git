upstream app_backend {
    server app:5000;
}

upstream prom_backend {
    server prometheus:9090;
}

upstream grafana_backend {
    server grafana:3000;
}

upstream node_backend {
    server node-exporter:9100;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /health {
        proxy_pass http://app_backend/health;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://app_backend/metrics;
        access_log off;
    }

    location /monitor/ {
        proxy_pass http://app_backend/monitor/;
    }

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        proxy_pass http://prom_backend/prometheus/;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana_backend/grafana/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /node-exporter {
        return 301 /node-exporter/metrics;
    }

    location = /node-exporter/metrics {
        proxy_pass http://node_backend/metrics;
        access_log off;
    }
}