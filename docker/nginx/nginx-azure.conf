# docker/nginx/nginx-azure.conf
# Azure App Service: all containers share localhost network

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    proxy_http_version  1.1;
    proxy_read_timeout  300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout  300s;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;

    # ── Health check ─────────────────────────────────────────────
    location = /health {
        proxy_pass http://localhost:5000/health;
        access_log off;
    }

    # ── App metrics ──────────────────────────────────────────────
    location = /metrics {
        proxy_pass http://localhost:5000/metrics;
        access_log off;
    }

    # ── Monitor status ───────────────────────────────────────────
    location /monitor/ {
        proxy_pass http://localhost:5000/monitor/;
    }

    # ── Main App ─────────────────────────────────────────────────
    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Prometheus ───────────────────────────────────────────────
    location = /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        proxy_pass http://localhost:9090/prometheus/;
    }

    # ── Grafana ──────────────────────────────────────────────────
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass       http://localhost:3000/grafana/;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Node Exporter ────────────────────────────────────────────
    location = /node-exporter {
        return 301 /node-exporter/metrics;
    }

    location = /node-exporter/metrics {
        proxy_pass http://localhost:9100/metrics;
        access_log off;
    }
}