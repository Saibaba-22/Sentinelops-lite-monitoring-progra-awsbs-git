server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    set_real_ip_from   0.0.0.0/0;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    # ── App ──
    location / {
        proxy_pass         http://localhost:5000;    # ← was http://app:5000
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass         http://localhost:5000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus ──
    location = /prometheus {
        return 301 $scheme://$host/prometheus/;
    }
    location /prometheus/ {
        proxy_pass         http://localhost:9090;    # ← was http://prometheus:9090
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Grafana ──
    location = /grafana {
        return 301 $scheme://$host/grafana/;
    }
    location /grafana/ {
        proxy_pass         http://localhost:3000;    # ← was http://grafana:3000
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # ── Node Exporter ──
    location = /node-exporter {
        return 301 $scheme://$host/node-exporter/metrics;
    }
    location /node-exporter/metrics {
        proxy_pass         http://localhost:9100/metrics;    # ← was http://node-exporter:9100
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}