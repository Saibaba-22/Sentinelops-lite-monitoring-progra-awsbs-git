# ═══════════════════════════════════════════════════════════════════
# docker/docker-compose.azure.yml
#
# REFERENCE ONLY as of Aug 2026 — Azure App Service deprecated
# multi-container COMPOSE deployment. Actual deploy now uses
# sitecontainers CLI (see deployment/deploy-azure.sh).
#
# Use this file for:
#   - Documentation of the 5-container architecture
#   - Local testing: docker-compose -f docker/docker-compose.azure.yml up
#   - Future migration to Container Apps / Kubernetes
# ═══════════════════════════════════════════════════════════════════
version: "3.8"

services:

  # ═════════════════════════════════════════════════════════════
  # NGINX — Public entrypoint (port 80)
  # Routes: /, /metrics, /prometheus/, /grafana/, /node-exporter/metrics
  # ═════════════════════════════════════════════════════════════
  nginx:
    image: __NGINX_IMAGE__
    ports:
      - "80:80"
    depends_on:
      - app
      - prometheus
      - grafana
      - node-exporter

  # ═════════════════════════════════════════════════════════════
  # APP — Flask + Prometheus metrics + GitHub auto-collector
  # ═════════════════════════════════════════════════════════════
  app:
    image: __APP_IMAGE__
    expose:
      - "5000"
    environment:
      - PORT=5000
      - APP_VERSION=1.0.0
      - BUILD_NUMBER=__BUILD_NUMBER__
      - ENVIRONMENT=__ENVIRONMENT__
      - METRICS_INTERVAL=5
      - PYTHONPATH=/app
      - TARGET_CLOUD=azure
      # ── Auth for /monitor/status and /metrics ─────────────────
      - MONITOR_TOKEN=__MONITOR_TOKEN__
      # ── AI Agent Monitor (Gemini) ─────────────────────────────
      - GEMINI_API_KEY=__GEMINI_API_KEY__
      - GOOGLE_API_KEY=__GEMINI_API_KEY__
      - AI_PROVIDER=__AI_PROVIDER__
      - AI_MODEL=__AI_MODEL__
      # ── GitHub Actions auto-collector ─────────────────────────
      - GITHUB_TOKEN_METRICS=__GH_METRICS_TOKEN__
      - GITHUB_REPO=__GH_METRICS_REPO__
      - GITHUB_POLL_INTERVAL=60

  # ═════════════════════════════════════════════════════════════
  # PROMETHEUS — Scrapes app + node-exporter, served at /prometheus/
  # ═════════════════════════════════════════════════════════════
  prometheus:
    image: __PROMETHEUS_IMAGE__
    expose:
      - "9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    depends_on:
      - app
      - node-exporter

  # ═════════════════════════════════════════════════════════════
  # GRAFANA — Dashboards, served at /grafana/
  # ═════════════════════════════════════════════════════════════
  grafana:
    image: __GRAFANA_IMAGE__
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=__GRAFANA_ADMIN_PASSWORD__
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=__GF_SERVER_DOMAIN__
      - GF_SERVER_ROOT_URL=__GF_SERVER_ROOT_URL__
      - GF_SERVER_SUB_PATH=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ENABLE_GZIP=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      - GF_LIVE_ALLOWED_ORIGINS=*
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - PROMETHEUS_URL=http://localhost:9090/prometheus/
    depends_on:
      - prometheus

  # ═════════════════════════════════════════════════════════════
  # NODE-EXPORTER — Host system metrics for Prometheus
  # ═════════════════════════════════════════════════════════════
  node-exporter:
    image: prom/node-exporter:v1.8.0
    expose:
      - "9100"
    command:
      - "--path.procfs=/proc"
      - "--path.sysfs=/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs)($$|/)"