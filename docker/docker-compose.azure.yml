# docker/docker-compose.azure.yml
version: "3.8"

services:
  app:
    image: __APP_IMAGE__
    restart: unless-stopped
    environment:
      - PORT=5000
      - APP_VERSION=1.0.0
      - BUILD_NUMBER=__BUILD_NUMBER__
      - ENVIRONMENT=__ENVIRONMENT__
      - METRICS_INTERVAL=5
      - MONITOR_TOKEN=${MONITOR_TOKEN}
      - PYTHONPATH=/app
    expose:
      - "5000"
    depends_on:
      - prometheus
    networks:
      - app-network

  nginx:
    image: __NGINX_IMAGE__
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
      - grafana
      - prometheus
    networks:
      - app-network

  prometheus:
    image: __PROMETHEUS_IMAGE__
    restart: unless-stopped
    expose:
      - "9090"
    networks:
      - app-network

  grafana:
    image: __GRAFANA_IMAGE__
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=__GF_SERVER_DOMAIN__
      - GF_SERVER_ROOT_URL=__GF_SERVER_ROOT_URL__
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - PROMETHEUS_URL=__PROMETHEUS_URL__
    expose:
      - "3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge