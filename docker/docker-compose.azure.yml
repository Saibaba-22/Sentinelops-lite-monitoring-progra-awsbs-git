version: "3.8"

services:

  app:
    image: __APP_IMAGE__
    restart: unless-stopped
    environment:
      - PORT=5000
      - APP_VERSION=1.0.0
      - BUILD_NUMBER=__BUILD_NUMBER__
      - ENVIRONMENT=__ENVIRONMENT__
      - METRICS_INTERVAL=5
      - MONITOR_TOKEN=__MONITOR_TOKEN__
      - PYTHONPATH=/app
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  nginx:
    image: __NGINX_IMAGE__
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
      - prometheus
      - grafana
      - node-exporter
    networks:
      - app-network

  prometheus:
    image: __PROMETHEUS_IMAGE__
    restart: unless-stopped
    expose:
      - "9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/prometheus/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  grafana:
    image: __GRAFANA_IMAGE__
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=__GRAFANA_ADMIN_PASSWORD__
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=__GF_SERVER_DOMAIN__
      - GF_SERVER_ROOT_URL=__GF_SERVER_ROOT_URL__
      - GF_SERVER_SUB_PATH=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - PROMETHEUS_URL=__PROMETHEUS_URL__
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - prometheus
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.8.0
    restart: unless-stopped
    expose:
      - "9100"
    command:
      - "--path.procfs=/proc"
      - "--path.sysfs=/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs)($$|/)"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge