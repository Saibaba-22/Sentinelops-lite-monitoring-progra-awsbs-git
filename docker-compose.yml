version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx-aws.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - prometheus
      - grafana
      - node-exporter

  app:
    image: replace_with_dockerhub_image_uri
    environment:
      - PORT=5000
      - APP_VERSION=1.0.0
      - BUILD_NUMBER=replace_with_build_number
      - ENVIRONMENT=replace_with_environment
      - METRICS_INTERVAL=5
      - MONITOR_TOKEN=replace_with_monitor_token
    volumes:
      - app-logs:/app/logs

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=/prometheus/"
    depends_on:
      - app
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=replace_with_gf_server_domain
      - GF_SERVER_ROOT_URL=replace_with_gf_server_root_url
      - GF_SERVER_SUB_PATH=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - PROMETHEUS_URL=http://prometheus:9090/prometheus/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.0
    command:
      - "--path.procfs=/proc"
      - "--path.sysfs=/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs)($|/)"

volumes:
  app-logs:
